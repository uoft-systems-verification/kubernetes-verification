translate = [
    "objectWithMeta",
    "Client",
    "ClientWithList",
    "ClientWithApply",
    "ClientWithListAndApply",
    "alsoLister",
    "alsoApplier",
    "Option",
    "NewClient",
    "NewClientWithList",
    "NewClientWithApply",
    "NewClientWithListAndApply",
]

imports = [
    "k8s.io/apimachinery/pkg/apis/meta/v1",
    "k8s.io/apimachinery/pkg/runtime",
    "k8s.io/client-go/rest",
]

