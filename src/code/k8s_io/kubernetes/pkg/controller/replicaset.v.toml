# Only what controllers/replicaset imports instead of copying (the condition
# helpers and ReplicaSetControllerFeatures); the rest of the upstream controller
# is not translated.
translate = [
    "ReplicaSetControllerFeatures",
    "NewReplicaSetCondition",
    "GetCondition",
    "SetCondition",
    "RemoveCondition",
    "filterOutCondition",
]

imports = [
    "k8s.io/api/apps/v1",
    "k8s.io/api/core/v1",
    "k8s.io/apimachinery/pkg/apis/meta/v1",
]
