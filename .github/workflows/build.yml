name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rocq-version: ["9.1.0"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Install Rocq
        uses: tchajed/setup-rocq@v1
        with:
          rocq-version: "${{ matrix.rocq-version }}"
          # Do not let setup-rocq scan this project's pin-depends: it sees
          # indirect coq/rocq library pins and cannot infer the compiler package.
          cache-key-opam-files: ""
      - name: Install dependencies
        run: |
          opam pin add --no-action -k path .
          opam install --deps-only .
      - name: Rocq build
        run: make -j8
      - name: opam install
        run: opam install --assume-built .
      - name: opam uninstall
        run: opam uninstall .

  pbt-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.0"
      - name: Install setup-envtest
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.0.0-20260216173200-e4c1c38bcbdb
      - name: Setup envtest binaries
        run: |
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.34.0 -p path)" >> $GITHUB_ENV
      - name: Run property-based tests
        working-directory: kubernetes_model
        run: |
          go test -v ./apimodel -run TestPBT -rapid.checks=1 -timeout=10m
